# AEGIS - Production Deployment
# Full 7-module stack with SSL, monitoring, and auto-healing

version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart-policy
  restart: unless-stopped

services:
  # ============ INFRASTRUCTURE ============

  postgres:
    image: postgres:16-alpine
    <<: *restart-policy
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:?Database password required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    <<: *restart-policy
    command: redis-server --requirepass ${AEGIS_REDIS_PASSWORD:?Redis password required} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AEGIS_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  kafka:
    image: redpandadata/redpanda:v23.3.8
    <<: *restart-policy
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --mode production
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafkadata:/var/lib/redpanda/data
    logging: *default-logging

  # ============ AEGIS MODULES ============

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
      args:
        - BUILD_ENV=production
    <<: *restart-policy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: WARNING
      DATABASE_URL: postgresql+asyncpg://aegis:${AEGIS_DB_PASSWORD}@postgres:5432/aegis
      REDIS_URL: redis://default:${AEGIS_REDIS_PASSWORD}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${AEGIS_JWT_SECRET:?JWT secret required}
      AEGIS_API_KEY: ${AEGIS_API_KEY:?API key required}
      CORS_ORIGINS: ${AEGIS_CORS_ORIGINS:-https://app.aegis.security}
      ALERT_WEBHOOK_URL: ${AEGIS_ALERT_WEBHOOK_URL:-}
      ALERT_SLACK_CHANNEL: ${AEGIS_ALERT_SLACK_CHANNEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging: *default-logging
    # Security: no volumes mounted in production (code is baked into image)
    # No .env files - all config via environment variables

  mcp-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    <<: *restart-policy
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      AEGIS_MCP_PORT: "8443"
      AEGIS_MCP_SANDBOX: "true"
      AEGIS_MCP_LOG_TRAFFIC: "false"
      AEGIS_MCP_UPSTREAM: ${AEGIS_MCP_UPSTREAM:-}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *default-logging

  # ============ MONITORING ============

  prometheus:
    image: prom/prometheus:v2.51.0
    <<: *restart-policy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.0
    <<: *restart-policy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    logging: *default-logging

  # ============ REVERSE PROXY ============

  nginx:
    image: nginx:1.25-alpine
    <<: *restart-policy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - backend
      - mcp-gateway
      - grafana
    logging: *default-logging

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  kafkadata:
    driver: local
  prometheusdata:
    driver: local
  grafanadata:
    driver: local