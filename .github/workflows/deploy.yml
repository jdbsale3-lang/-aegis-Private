# AEGIS — Deploy to Production (CD)
name: AEGIS Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${github.event.inputs.environment || 'production'})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CI image tag
        run: echo "Deploying ref $GITHUB_SHA to $DEPLOY_HOST"

      - name: Deploy over SSH (repo pull + docker compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AEGIS_DEPLOY_HOST }}
          username: ${{ secrets.AEGIS_DEPLOY_USER }}
          key: ${{ secrets.AEGIS_DEPLOY_SSH_KEY }}
          port: ${{ secrets.AEGIS_DEPLOY_PORT || 22 }}
          script: |
            set -e
            # AEGIS prod = systemd aegis-api.service (venv + nginx), NOT docker
            cd ${{ secrets.AEGIS_DEPLOY_PATH }}
            git fetch origin && git checkout main && git pull origin main
            # copy new backend code in place, keep venv + data
            cp -a backend/* backend/ 2>/dev/null || true
            # (repo clone layout: backend/ is the app; ensure api_server.py is in place)
            cd /opt/aegis/backend
            test -f api_server.py || { echo "api_server.py missing"; exit 1; }
            python3 -m py_compile api_server.py core/security.py modules/supply_chain/scanner.py modules/prompt_defense/classifier.py
            chown -R aegis:aegis /opt/aegis/backend
            systemctl restart aegis-api.service
            sleep 3
            systemctl is-active aegis-api.service

      - name: Post-deploy smoke (health + auth + CVE matrix)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf https://apiaegissecurity.tech/health
          curl -sf -o /dev/null -w "health %{http_code}\n" https://apiaegissecurity.tech/health
          echo "Deploy complete - run full acceptance (DEPLOY-RUNBOOK.md section 7) for final sign-off."

  notify:
    name: Notify
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "AEGIS deploy finished with status ${STATUS}"
        env:
          STATUS: ${{ needs.deploy.result }}